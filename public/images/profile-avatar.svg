<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0e1726" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#3f3f46" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas with Rounded Corners -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Lines -->
  <path d="M 50 0 L 50 400 M 100 0 L 100 400 M 150 0 L 150 400 M 200 0 L 200 400 M 250 0 L 250 400 M 300 0 L 300 400 M 350 0 L 350 400" stroke="#334155" stroke-opacity="0.15" stroke-width="1" />
  <path d="M 0 50 L 400 50 M 0 100 L 400 100 M 0 150 L 400 150 M 0 200 L 400 200 M 0 250 L 400 250 M 0 300 L 400 300 M 0 350 L 400 350" stroke="#334155" stroke-opacity="0.15" stroke-width="1" />

  <!-- Outer Neon Pulse Ring -->
  <circle cx="200" cy="190" r="145" fill="none" stroke="url(#neonGrad)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.75" />
  <circle cx="200" cy="190" r="130" fill="#111827" fill-opacity="0.8" stroke="#374151" stroke-width="1.5" />

  <!-- Developer Silhouette / Illustration -->
  <g id="avatar">
    <!-- Torso / Hoodie -->
    <path d="M 120 330 C 120 270, 160 250, 200 250 C 240 250, 280 270, 280 330 Z" fill="#312e81" stroke="url(#neonGrad)" stroke-width="2" />
    
    <!-- Inner Hoodie Collar -->
    <path d="M 175 252 Q 200 280 225 252 Z" fill="#1e1b4b" />
    
    <!-- Neck -->
    <rect x="186" y="215" width="28" height="38" rx="6" fill="#fbcfe8" />
    
    <!-- Head / Face -->
    <ellipse cx="200" cy="175" rx="52" ry="58" fill="#fbcfe8" />
    
    <!-- Hair -->
    <path d="M 148 175 C 148 115, 252 115, 252 175 C 252 145, 238 128, 200 128 C 162 128, 148 145, 148 175 Z" fill="url(#hairGrad)" />
    <path d="M 145 170 Q 148 230 162 245 Q 155 200 152 165 Z" fill="url(#hairGrad)" />
    <path d="M 255 170 Q 252 230 238 245 Q 245 200 248 165 Z" fill="url(#hairGrad)" />

    <!-- Sleek Tech Glasses -->
    <rect x="162" y="165" width="30" height="18" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="2" />
    <rect x="208" y="165" width="30" height="18" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="2" />
    <line x1="192" y1="174" x2="208" y2="174" stroke="#06b6d4" stroke-width="2" />
    <circle cx="177" cy="174" r="3" fill="#38bdf8" />
    <circle cx="223" cy="174" r="3" fill="#38bdf8" />

    <!-- Friendly Smile -->
    <path d="M 188 208 Q 200 216 212 208" stroke="#e11d48" stroke-width="2" fill="none" stroke-linecap="round" />
  </g>

  <!-- Floating Floating Tech Badges around Avatar -->
  <g transform="translate(60, 95)" filter="url(#glowEffect)">
    <rect width="64" height="28" rx="14" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
    <text x="32" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#22d3ee" text-anchor="middle">&lt;React/&gt;</text>
  </g>

  <g transform="translate(280, 110)" filter="url(#glowEffect)">
    <rect width="60" height="28" rx="14" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" />
    <text x="30" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#c084fc" text-anchor="middle">Python</text>
  </g>

  <g transform="translate(45, 275)" filter="url(#glowEffect)">
    <rect width="52" height="26" rx="13" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <text x="26" y="17" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">JS/ES6</text>
  </g>

  <g transform="translate(300, 270)" filter="url(#glowEffect)">
    <rect width="54" height="26" rx="13" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
    <text x="27" y="17" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle">IoT</text>
  </g>

  <!-- Bottom Badge: Replace with your photo -->
  <rect x="70" y="355" width="260" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <text x="200" y="373" font-family="'Outfit', sans-serif" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="middle">
    Replace: public/images/profile.png
  </text>
</svg>
