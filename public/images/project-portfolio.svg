<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glowG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#pGrad)" />
  
  <!-- Browser Window Mockup -->
  <g transform="translate(60, 45)">
    <rect width="480" height="270" rx="12" fill="#0f172a" stroke="#4338ca" stroke-width="2" />
    <!-- Window controls -->
    <circle cx="20" cy="20" r="6" fill="#f43f5e" />
    <circle cx="38" cy="20" r="6" fill="#fbbf24" />
    <circle cx="56" cy="20" r="6" fill="#10b981" />
    
    <!-- URL bar -->
    <rect x="80" y="10" width="320" height="20" rx="6" fill="#1e293b" />
    <text x="95" y="24" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">https://yuvasri.dev</text>

    <!-- Inner page preview -->
    <rect x="30" y="55" width="200" height="24" rx="4" fill="url(#glowG)" />
    <text x="40" y="71" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Hi, I'm YUVASRI 👋</text>
    
    <rect x="30" y="90" width="220" height="12" rx="4" fill="#334155" />
    <rect x="30" y="110" width="180" height="12" rx="4" fill="#334155" />

    <!-- Project cards inside preview -->
    <rect x="30" y="140" width="125" height="95" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
    <rect x="170" y="140" width="125" height="95" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
    <rect x="310" y="140" width="135" height="95" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />

    <!-- Right Side Code snippet box -->
    <rect x="290" y="55" width="155" height="70" rx="6" fill="#020617" stroke="#334155" stroke-width="1" />
    <text x="300" y="75" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8">const dev = {</text>
    <text x="310" y="90" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a78bfa">  name: 'YUVASRI',</text>
    <text x="310" y="105" font-family="'JetBrains Mono', monospace" font-size="9" fill="#34d399">  ready: true</text>
    <text x="300" y="118" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8">};</text>
  </g>
</svg>
